name: Court simulator tests
on:
  push:
    branches: [main, feature/simulator-v02]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic simulation tests
        run: node --test engine/core.test.mjs
      - name: Syntax check
        run: |
          node --check engine/core.mjs
          node --check prototype/app.js
